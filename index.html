<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Merger Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 max-w-md w-full border border-slate-200">
    
    <!-- Navigation Tabs -->
    <div class="flex border-b border-slate-200 mb-6">
      <button id="excelTab" onclick="switchMode('excel')" class="flex-1 py-2 font-semibold text-sm border-b-2 border-blue-600 text-blue-600 focus:outline-none transition">
        Excel Merger
      </button>
      <button id="pdfTab" onclick="switchMode('pdf')" class="flex-1 py-2 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 focus:outline-none transition">
        PDF Merger
      </button>
    </div>

    <h1 id="title" class="text-2xl font-bold text-slate-800 mb-1">Excel Sheet Merger</h1>
    <p id="subtitle" class="text-xs text-slate-500 mb-5">Select multiple Excel (.xlsx) files to combine them into one.</p>

    <form id="uploadForm" class="space-y-4">
      <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:border-blue-500 transition cursor-pointer">
        <input type="file" id="fileInput" name="files" multiple accept=".xlsx, .xls" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" />
        <span id="fileCount" class="block mt-2 text-xs text-slate-400">0 files selected</span>
      </div>
      <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl transition shadow">
        Merge & Download
      </button>
    </form>
    <div id="status" class="mt-4 text-center text-sm font-medium hidden"></div>
  </div>

  <script>
    let currentMode = 'excel';
    const excelTab = document.getElementById('excelTab');
    const pdfTab = document.getElementById('pdfTab');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const fileInput = document.getElementById('fileInput');
    const fileCount = document.getElementById('fileCount');
    const form = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');
    const status = document.getElementById('status');

    function switchMode(mode) {
      currentMode = mode;
      fileInput.value = '';
      fileCount.innerText = '0 files selected';
      status.classList.add('hidden');

      if (mode === 'excel') {
        excelTab.className = "flex-1 py-2 font-semibold text-sm border-b-2 border-blue-600 text-blue-600 focus:outline-none transition";
        pdfTab.className = "flex-1 py-2 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 focus:outline-none transition";
        title.innerText = "Excel Sheet Merger";
        subtitle.innerText = "Select multiple Excel (.xlsx) files to combine them into one.";
        fileInput.accept = ".xlsx, .xls";
      } else {
        pdfTab.className = "flex-1 py-2 font-semibold text-sm border-b-2 border-blue-600 text-blue-600 focus:outline-none transition";
        excelTab.className = "flex-1 py-2 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 focus:outline-none transition";
        title.innerText = "PDF Document Merger";
        subtitle.innerText = "Select multiple PDF (.pdf) files to combine them into a single PDF.";
        fileInput.accept = ".pdf";
      }
    }

    fileInput.addEventListener('change', () => { fileCount.innerText = `${fileInput.files.length} file(s) selected`; });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!fileInput.files.length) { alert("Please select at least one file."); return; }

      submitBtn.disabled = true;
      submitBtn.innerText = "Processing files...";
      status.className = "mt-4 text-center text-sm font-medium text-blue-600";
      status.innerText = "Merging files, please wait...";
      status.classList.remove("hidden");

      const formData = new FormData();
      for (const file of fileInput.files) formData.append("files", file);

      const endpoint = currentMode === 'excel' ? '/merge' : '/merge-pdf';
      const defaultFileName = currentMode === 'excel' ? 'merged_output.xlsx' : 'merged_output.pdf';

      try {
        const response = await fetch(endpoint, { method: "POST", body: formData });
        if (!response.ok) throw new Error("Merge failed.");
        const blob = await response.blob();
        const a = document.createElement("a");
        a.href = window.URL.createObjectURL(blob);
        a.download = defaultFileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        status.className = "mt-4 text-center text-sm font-medium text-emerald-600";
        status.innerText = "Done! Download started.";
      } catch (err) {
        status.className = "mt-4 text-center text-sm font-medium text-rose-600";
        status.innerText = "An error occurred during merging.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Merge & Download";
      }
    });
  </script>
</body>
</html>
